name: Build RedAlert DLL
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Install Windows 8.1 SDK
        run: choco install windows-sdk-8.1 -y --no-progress
      - name: Install VS2017 (v141) C++ toolset
        shell: pwsh
        run: |
          $vs = & 'C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe' -latest -property installationPath
          $p = Start-Process -FilePath 'C:\Program Files (x86)\Microsoft Visual Studio\Installer\vs_installer.exe' -Wait -PassThru -ArgumentList 'modify','--installPath',('"' + $vs + '"'),'--add','Microsoft.VisualStudio.Component.VC.v141.x86.x64','--quiet','--norestart','--noUpdateInstaller'
          Write-Host ('installer exit code ' + $p.ExitCode)
      - name: Build RedAlert (Release, Win32, v141)
        run: msbuild RedAlert\RedAlert.vcxproj /p:Configuration=Release /p:Platform=Win32 /p:PlatformToolset=v141 /p:WindowsTargetPlatformVersion=8.1 /m
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RedAlert-dll
          path: bin/Win32/RedAlert.dll
