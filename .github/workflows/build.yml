name: Build RedAlert DLL
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Build RedAlert (Release, Win32)
        env:
          CL: /DWINDOWS_IGNORE_PACKING_MISMATCH
        run: msbuild RedAlert\RedAlert.vcxproj /p:Configuration=Release /p:Platform=Win32 /p:PlatformToolset=v143 /p:WindowsTargetPlatformVersion=10.0 /m
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RedAlert-dll
          path: |
            bin/**/*.dll
            **/Release/*.dll
