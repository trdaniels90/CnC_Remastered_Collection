name: Build RedAlert DLL
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: windows-2019
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Build RedAlert (Release, Win32)
        run: msbuild RedAlert\RedAlert.vcxproj /p:Configuration=Release /p:Platform=Win32 /m
      - uses: actions/upload-artifact@v4
        with:
          name: RedAlert-dll
          path: |
            bin/**/*.dll
            **/Release/*.dll
